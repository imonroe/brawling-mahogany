name: Uptime

# PRD §9 asks for an uptime check. This is it.
#
# Be clear about what this is and is not. A scheduled workflow is delayed under
# load, sometimes by several minutes; it cannot tell you GitHub itself is down;
# GitHub notifies only the person who created the workflow — transferring only
# when somebody else changes the *cron syntax*, not on any other edit — and not
# the repository's watchers; and GitHub disables cron schedules in a repository
# with no activity for 60 days. It is the in-repository baseline, not a
# monitoring product. If a dedicated monitor is bought later, delete this
# rather than running both.
#
# It does not tick from `dev`. GitHub runs `schedule` only from the copy of a
# workflow on the *default* branch, and offers `workflow_dispatch` only for a
# workflow present there — and this repository reserves `main` for tagged
# releases (CLAUDE.md). So this starts running at the next `dev` -> `main`
# release, not when it merges. Setting the variables before then is correct and
# will simply produce no runs; that is the schedule, not a wrong variable name.
#
# It watches whichever of these repository *variables* are set, and warns on
# the ones that are not — an unmonitored environment has to be visible on the
# run summary rather than look exactly like a healthy one:
#
#   UPTIME_STAGING_URL      e.g. https://staging.example.com
#   UPTIME_PRODUCTION_URL   e.g. https://example.com
#
# The names are prefixed on purpose. `STAGING_URL` is already a *secret* used
# by the deploy workflow, and a variable of the same name would read as empty
# here — producing a job that passes while checking nothing, which is the worst
# thing a monitor can do.
#
# Variables, not secrets, and deliberately: `vars` are unavailable to `secrets`'
# masking and this repository is public, so the endpoint appears in the run log
# in the clear. A hostname that resolves in public DNS is not a secret, and a
# monitor whose target is unreadable is harder to trust than one whose target
# is obvious. Do not put anything else in these.

on:
  schedule:
    # Every fifteen minutes, which is the alerting window PRD §9 sets for a
    # queue failure and a sensible floor for this too.
    - cron: '*/15 * * * *'
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: uptime
  # Never cancel: a cancelled run sends no failure notification, so cancelling
  # is one of the few ways this monitor could go quiet during an actual outage.
  # Two overlapping checks are harmless.
  cancel-in-progress: false

jobs:
  check:
    name: ${{ matrix.environment }}
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        include:
          - environment: staging
            url: ${{ vars.UPTIME_STAGING_URL }}
          - environment: production
            url: ${{ vars.UPTIME_PRODUCTION_URL }}

    steps:
      - name: Check the health endpoint
        if: matrix.url != ''
        env:
          URL: ${{ matrix.url }}
        run: |
          # Two attempts, twenty seconds apart: one refused connection during a
          # deploy is not an outage, and a monitor that cries wolf gets muted.
          # Trailing slashes are easy to leave on a repository variable.
          endpoint="${URL%/}/up"

          for attempt in 1 2; do
            # curl already prints 000 when it cannot connect; a `|| echo`
            # here would append a second one and print 000000.
            status=$(curl -sS -o /dev/null -w '%{http_code}' --max-time 15 --location "$endpoint" || true)

            if [ "$status" = "200" ]; then
              echo "$endpoint answered 200 on attempt $attempt."
              exit 0
            fi

            echo "Attempt $attempt: $endpoint answered ${status:-000}." >&2

            if [ "$attempt" = "1" ]; then
              sleep 20
            fi
          done

          echo "::error::${{ matrix.environment }} is not answering on /up."
          exit 1

      - name: Nothing to watch
        if: matrix.url == ''
        # A warning rather than a plain echo, because this step is exactly what
        # runs when someone stores the URL as a *secret* instead of a variable
        # — as the deploy checklist asks them to for STAGING_URL. Without it,
        # an unmonitored environment is indistinguishable from a healthy one on
        # the run summary.
        run: |
          echo "::warning::No URL configured for ${{ matrix.environment }}; this environment is not being monitored. Set the UPTIME_*_URL repository variable (a variable, not a secret)."

